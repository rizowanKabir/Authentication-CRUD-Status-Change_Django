{% extends "base.html" %}

{% block content %}

<style>
    /* Full page hero section */
    .hero {
        position: relative;
        width: 100%;
        height: 90vh;
        background: url('/static/images/home_bg.jpg') no-repeat center center/cover;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Overlay for better text visibility */
    .hero::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1;
    }

    /* Hero content */
    .hero-content {
        position: relative;
        z-index: 2;
        max-width: 800px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        backdrop-filter: blur(8px);
    }

    .hero-title {
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 20px;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
    }

    .hero-subtitle {
        font-size: 24px;
        margin-bottom: 30px;
    }

    .badge {
        display: inline-block;
        padding: 10px 20px;
        background: linear-gradient(45deg, #4CAF50, #2ecc71);
        color: white;
        border-radius: 25px;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .hero-title { font-size: 36px; }
        .hero-subtitle { font-size: 18px; }
        .badge { padding: 8px 16px; font-size: 14px; }
    }
</style>

<div class="hero">
    <div class="hero-content">
        <div class="hero-title">Welcome to Your Homepage</div>
        <div class="hero-subtitle">Discover your dashboard and stay productive!</div>
    </div>
</div>

{% endblock %}
