<!DOCTYPE html>
<html>
<head>
    <title>Website</title>
    <style>
        /* Navbar container */
        .navbar {
            background: linear-gradient(90deg, #4e73df, #1cc88a);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* Brand/Logo */
        .navbar .brand {
            font-size: 24px;
            font-weight: bold;
        }

        /* Navbar links container */
        .navbar ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        /* Navbar links */
        .navbar ul li {
            margin-left: 20px;
        }

        .navbar ul li a {
            text-decoration: none;
            color: white;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 5px;
            transition: background 0.3s, color 0.3s;
        }

        /* Hover effect */
        .navbar ul li a:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* Responsive: Stack links vertically on small screens */
        @media screen and (max-width: 600px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar ul {
                flex-direction: column;
                width: 100%;
            }

            .navbar ul li {
                margin-left: 0;
                margin-bottom: 10px;
            }
        }

         body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1cc88a;
            color: white;
            border: none;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #17a673;
        }
    </style>
</head>
<body>

{% include "navbar.html" %}
{% block content %}

{% endblock %}

</body>
</html>
