<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            background: linear-gradient(to right, #36b9cc, #f6c23e);
            font-family: Arial, sans-serif;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1cc88a;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #17a673;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>Login Form</h2>
         {% include "messages.html" %}
        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username"placeholder="Enter Your Username" required>

            <label>Password</label>
            <input type="password" name="password"placeholder="Enter Your password" required>

            <button type="submit">Login</button>
        </form>
        <div class="register-link">
            <p>Don't have an account? 
                <a href="{% url 'register_page' %}">Register here</a>
            </p>
        </div>
    </div>

</body>
</html>
