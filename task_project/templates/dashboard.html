{% extends "base.html" %}

{% block content %}
{% include "messages.html" %}

<style>
    .home-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
    }

    .home-card {
        background: #ffffff;
        padding: 40px;
        width: 450px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        text-align: center;
        transition: 0.3s ease;
    }

    .home-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    .home-title {
        font-size: 28px;
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 20px;
    }

    .user-type {
        margin-top: 20px;
        font-size: 18px;
    }

    .badge {
        display: inline-block;
        padding: 8px 15px;
        background: linear-gradient(45deg, #4CAF50, #2ecc71);
        color: white;
        border-radius: 20px;
        font-weight: bold;
        margin-left: 5px;
    }
</style>

<div class="home-container">
    <div class="home-card">
        <div class="home-title">Welcome to the Dashboard</div>
        <hr>
        <div class="user-type">
            User Type:
            <span class="badge">
                {{ request.user.user_type }}
            </span>
        </div>
    </div>
</div>

{% endblock %}
